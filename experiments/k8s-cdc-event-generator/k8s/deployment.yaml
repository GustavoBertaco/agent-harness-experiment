apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-generator
  labels:
    app: event-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-generator
  template:
    metadata:
      labels:
        app: event-generator
    spec:
      containers:
        - name: event-generator
          image: cdc-event-generator:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: event-generator-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
